[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrive-dl"
version = "1.0.2"
description = "Reliable CLI and HTTP API for downloading private Google Drive files with an isolated Chrome session."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "lococoi" },
]
keywords = [
    "google-drive",
    "yt-dlp",
    "chrome",
    "download",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.scripts]
gdrive-dl = "gdrive_dl.__main__:main"

[project.urls]
Homepage = "https://github.com/lococoi/gdrive-dl"
Repository = "https://github.com/lococoi/gdrive-dl"
Issues = "https://github.com/lococoi/gdrive-dl/issues"

[tool.setuptools.packages.find]
include = ["gdrive_dl*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
